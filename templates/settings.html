{% extends "base.html" %}

{% block title %}Settings - CybWatch{% endblock %}

{% block content %}
<div>
    <h2 class="text-3xl font-bold mb-6">Settings</h2>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Email config -->
        <div class="bg-gray-800 rounded-lg border border-gray-700">
            <div class="p-4 border-b border-gray-700">
                <h3 class="text-xl font-semibold">Email Notifications</h3>
            </div>
            <div class="p-4" 
                 hx-get="/api/settings/email" 
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <p class="text-gray-400">Loading...</p>
            </div>
        </div>
        
        <!-- Detection Rules -->
        <div class="bg-gray-800 rounded-lg border border-gray-700">
            <div class="p-4 border-b border-gray-700">
                <h3 class="text-xl font-semibold">Detection Rules</h3>
            </div>
            <div class="p-4" 
                 id="rules-container"
                 hx-get="/api/settings/rules" 
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <p class="text-gray-400">Loading...</p>
            </div>
        </div>
        
        <!-- System Info -->
        <div class="bg-gray-800 rounded-lg border border-gray-700">
            <div class="p-4 border-b border-gray-700">
                <h3 class="text-xl font-semibold">System Info</h3>
            </div>
            <div class="p-4" 
                 hx-get="/api/settings/system" 
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <p class="text-gray-400">Loading...</p>
            </div>
        </div>
        
        <!-- Zeek Status -->
        <div class="bg-gray-800 rounded-lg border border-gray-700">
            <div class="p-4 border-b border-gray-700">
                <h3 class="text-xl font-semibold">Zeek Status</h3>
            </div>
            <div class="p-4" 
                 hx-get="/api/settings/zeek" 
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <p class="text-gray-400">Loading...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
